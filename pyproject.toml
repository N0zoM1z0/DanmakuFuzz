[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danmakufuzz"
version = "0.1.0"
description = "Touhou 6 fuzzing workbench for semantic and parser-oriented research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yann" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
